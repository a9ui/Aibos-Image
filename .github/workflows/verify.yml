name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-surface:
    name: Public surface verification
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify WPF-only public surface
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-public-surface.ps1 -FullTree

      - name: Verify contract index and bundles
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-contract-index.ps1

      - name: Verify launch artifact freshness
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-launch-target.ps1

      - name: Verify desktop installer failure handling
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-desktop-launcher-install.ps1

      - name: Verify initial cutover boot evidence without OS changes
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-cutover-boot-evidence.ps1

      - name: Verify pinned desktop route without host task changes
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-cutover-desktop-graph.ps1

      - name: Verify console-independent launch
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-launch-detachment.ps1

      - name: Verify legacy asset ledger
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-legacy-asset-ledger.ps1

  wpf:
    name: WPF verification
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Release build
        shell: pwsh
        run: dotnet build .\local-native\PhotoViewer.Wpf\PhotoViewer.Wpf.csproj -c Release --nologo

      - name: Verify immutable initial cutover intent and interrupted publication
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-cutover-intent.ps1

      - name: Verify explicit cutover phase integration without host changes
        shell: pwsh
        run: |
          $flowOutput = powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-cutover-flow.ps1 -WpfDll .\local-native\PhotoViewer.Wpf\bin\Release\net10.0-windows\PhotoViewer.Wpf.dll
          if ($LASTEXITCODE -ne 0) { throw 'Cutover flow verification failed.' }
          $flowOutput | Write-Output
          $flow = ($flowOutput -join "`n") | ConvertFrom-Json
          $marker = Join-Path $flow.fixtureRoot 'enhance\enqueue-inbox\maintenance.json'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-durable-enqueue-inbox.ps1 -MaintenanceMarkerFixturePath $marker
          if ($LASTEXITCODE -ne 0) { throw 'Cutover admission reader verification failed.' }

      - name: Desktop activation interoperability
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-desktop-activation.ps1

      - name: Desktop startup error feedback
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-desktop-launch-errors.ps1

      - name: External image open command boundary
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-external-open-target.ps1 -SkipBuild

      - name: Operation log path security smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-operation-log-security.ps1 -SkipBuild

      - name: Shared data root locator contract
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-shared-root-locator.ps1 -AssemblyPath .\local-native\PhotoViewer.Wpf\bin\Release\net10.0-windows\PhotoViewer.Wpf.dll

      - name: One-time shared data root setup
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-shared-root-setup.ps1

      - name: WPF durable-state fixture contract
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-shared-state-contracts.ps1 -ExecutablePath .\local-native\PhotoViewer.Wpf\bin\Release\net10.0-windows\PhotoViewer.Wpf.exe

      - name: Shared settings and delete-confirmation smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-thumbnail-status-borders.ps1 -ExecutablePath .\local-native\PhotoViewer.Wpf\bin\Release\net10.0-windows\PhotoViewer.Wpf.exe

      - name: Shared recent-folder smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-shared-recent.ps1 -AssemblyPath .\local-native\PhotoViewer.Wpf\bin\Release\net10.0-windows\PhotoViewer.Wpf.dll

      - name: Workbench selection projection smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-right-panel.ps1 -SkipBuild

      - name: Thumbnail continuity and virtualized grid smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-thumbnail-continuity.ps1 -SkipBuild

      - name: Large catalog interaction smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-catalog-interaction.ps1 -SkipBuild -Count 100000

      - name: Compact and high-DPI work-area smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-monitor-work-area.ps1 -SkipBuild

      - name: Modal interaction smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-modal-interaction.ps1 -AssemblyPath .\local-native\PhotoViewer.Wpf\bin\Release\net10.0-windows\PhotoViewer.Wpf.dll

      - name: Album library hardening smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-album-library-hardening.ps1 -AssemblyPath .\local-native\PhotoViewer.Wpf\bin\Release\net10.0-windows\PhotoViewer.Wpf.dll

      - name: Populated Album Library capture
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\capture-wpf-album-library.ps1 -SkipBuild

      - name: Accessibility and high-contrast smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-accessibility.ps1 -SkipBuild

      - name: Color contrast smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-color-contrast.ps1

      - name: Optional Enhancement bridge smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-modal-enhancement-actions.ps1 -AssemblyPath .\local-native\PhotoViewer.Wpf\bin\Release\net10.0-windows\PhotoViewer.Wpf.dll

      - name: Enhancement SQLite reader smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-enhancement-sqlite-reader.ps1 -SkipBuild

      - name: AI photoreal modal and shared queue smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-modal-photoreal.ps1 -AssemblyPath .\local-native\PhotoViewer.Wpf\bin\Release\net10.0-windows\PhotoViewer.Wpf.dll

      - name: Photoreal reader-only safety smoke
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\verify-wpf-photoreal-safety.ps1 -AssemblyPath .\local-native\PhotoViewer.Wpf\bin\Release\net10.0-windows\PhotoViewer.Wpf.dll

      - name: Video reader, playback, settings, and request smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-enhancement-operation-filter.ps1 -AssemblyPath .\local-native\PhotoViewer.Wpf\bin\Release\net10.0-windows\PhotoViewer.Wpf.dll

      - name: Enhancement jobs workspace smoke
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\verify-wpf-enhancement-jobs-workspace.ps1 -AssemblyPath .\local-native\PhotoViewer.Wpf\bin\Release\net10.0-windows\PhotoViewer.Wpf.dll

      - name: Favorite presentation close-drain smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-favorite-performance.ps1 -AssemblyPath .\local-native\PhotoViewer.Wpf\bin\Release\net10.0-windows\PhotoViewer.Wpf.dll -OverallTimeoutSeconds 180

      - name: Local AI Style forward-compatibility smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-style-state-forward-compat.ps1 -SkipBuild -ExecutablePath .\local-native\PhotoViewer.Wpf\bin\Release\net10.0-windows\PhotoViewer.Wpf.exe -OverallTimeoutSeconds 120

      - name: Selected batch enhancement smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-selected-batch-enhancement.ps1 -AssemblyPath .\local-native\PhotoViewer.Wpf\bin\Release\net10.0-windows\PhotoViewer.Wpf.dll

      - name: Durable enqueue publication and close smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-durable-enqueue-publication.ps1 -AssemblyPath .\local-native\PhotoViewer.Wpf\bin\Release\net10.0-windows\PhotoViewer.Wpf.dll

      - name: Companion smoke path boundary
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-h25-companion-path-boundary.ps1
