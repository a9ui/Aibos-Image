name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-surface:
    name: Public surface verification
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify WPF-only public surface
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-public-surface.ps1 -FullTree

      - name: Verify legacy asset ledger
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-legacy-asset-ledger.ps1

  wpf:
    name: WPF verification
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Release build
        shell: pwsh
        run: dotnet build .\local-native\PhotoViewer.Wpf\PhotoViewer.Wpf.csproj -c Release --nologo

      - name: Shared data root locator contract
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-shared-root-locator.ps1

      - name: One-time shared data root setup
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-shared-root-setup.ps1

      - name: WPF durable-state fixture contract
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-parity-foundation.ps1

      - name: Shared settings and delete-confirmation smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-thumbnail-status-borders.ps1

      - name: Shared recent-folder smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-shared-recent.ps1

      - name: Workbench selection projection smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-right-panel.ps1 -SkipBuild

      - name: Thumbnail continuity and virtualized grid smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-thumbnail-continuity.ps1 -SkipBuild

      - name: Large catalog interaction smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-catalog-interaction.ps1 -SkipBuild -Count 100000

      - name: Compact and high-DPI work-area smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-monitor-work-area.ps1 -SkipBuild

      - name: Modal interaction smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-modal-interaction.ps1

      - name: Album library hardening smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-album-library-hardening.ps1

      - name: Populated Album Library capture
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\capture-wpf-album-library.ps1 -SkipBuild

      - name: Accessibility and high-contrast smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-accessibility.ps1 -SkipBuild

      - name: Color contrast smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-color-contrast.ps1

      - name: Optional Enhancement bridge smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-modal-enhancement-actions.ps1

      - name: AI photoreal modal and shared queue smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-modal-photoreal.ps1

      - name: Enhancement jobs workspace smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-enhancement-jobs-workspace.ps1

      - name: Selected batch enhancement smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-selected-batch-enhancement.ps1 -SkipBuild

      - name: Companion smoke path boundary
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-wpf-h25-companion-path-boundary.ps1
